openapi: 3.0.3
info:
  title: New Hire Document Submission & Status Retrieval API
  description: |
    RESTful API contract for the Employee Center New Hire Onboarding Portal.
    Provides endpoints for submitting onboarding verification documents and retrieving real-time verification status.
    
    ### Architectural Principles:
    - **RESTful Resource Modeling**: `/documents` as primary resource collection.
    - **HTTP Methods**: `POST` for submission, `GET` for status querying.
    - **Standard HTTP Status Codes**: Explicit mappings for 200, 201, 400, 401, 404, 409, and 500.
    - **Strict JSON Schema Validation**: Typed fields, formats, regex constraints, and required attributes.
  version: 1.0.0
  contact:
    name: HR Systems Integration Team
    email: hr-api-support@company.com
servers:
  - url: https://api.onboarding.company.com/api/v1
    description: Production REST Gateway
  - url: https://staging-api.onboarding.company.com/api/v1
    description: Staging / Sandbox Environment
  - url: http://localhost:8080/api/v1
    description: Local Mock Server

tags:
  - name: Document Submission
    description: Operations for uploading and validating onboarding documents
  - name: Document Status
    description: Operations for inspecting verification and approval lifecycle

paths:
  /onboarding/documents:
    post:
      tags:
        - Document Submission
      summary: Submit a new hire verification document
      description: |
        Accepts employee details, document metadata, and file information.
        Converts valid submissions into a registered onboarding document record.
        Prevents duplicate submissions via Idempotency-Key or unique Request ID + Document Type constraints.
      operationId: submitDocument
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique client-generated UUID to ensure duplicate submissions are safely ignored.
          schema:
            type: string
            format: uuid
            example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        - name: X-Correlation-ID
          in: header
          required: false
          description: Distributed tracing identifier.
          schema:
            type: string
            example: corr-789a-4bc1-bf22-1092837465ab
      requestBody:
        required: true
        description: JSON document submission payload matching the onboarding schema.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSubmissionRequest'
            examples:
              validGovernmentIdSubmission:
                summary: Valid Government Photo ID Submission
                value:
                  employeeName: "Alice Cooper"
                  requestId: "REQ-54321"
                  documentType: "government-id"
                  submissionDate: "2026-09-08"
                  file:
                    name: "passport_scan.pdf"
                    sizeBytes: 2097152
                    mimeType: "application/pdf"
                    extension: "PDF"
                    contentBase64: "JVBERi0xLjQKJcTl8uXr...[truncated]"
                  consentCertified: true
      responses:
        '201':
          description: Document successfully submitted, validated, and registered.
          headers:
            Location:
              description: URI of the created document status resource.
              schema:
                type: string
                example: /api/v1/onboarding/documents/SUB-731934
            X-Correlation-ID:
              description: Trace ID echoed back to client.
              schema:
                type: string
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSubmissionResponse'
              examples:
                createdResponse:
                  summary: Created Document Record
                  value:
                    success: true
                    statusCode: 201
                    submissionId: "SUB-731934"
                    trackingUrl: "https://api.onboarding.company.com/api/v1/onboarding/documents/SUB-731934"
                    status: "PENDING_VERIFICATION"
                    submittedAt: "2026-09-08T10:45:00Z"
                    data:
                      employeeName: "Alice Cooper"
                      requestId: "REQ-54321"
                      documentType:
                        code: "government-id"
                        label: "Government Issued Photo ID"
                        mandatory: true
                      submissionDate: "2026-09-08"
                      file:
                        name: "passport_scan.pdf"
                        sizeBytes: 2097152
                        sizeFormatted: "2 MB"
                        extension: "PDF"
                        mimeType: "application/pdf"
                      consentCertified: true
                    timeline:
                      expectedReviewBy: "2026-09-10T17:00:00Z"
                      slaHours: 48
        '400':
          description: Bad Request - Client validation failed (e.g. invalid date format, future date, missing fields, file > 10MB).
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationFailure:
                  summary: Field-Level Validation Rejection
                  value:
                    success: false
                    statusCode: 400
                    error: "VALIDATION_FAILED"
                    message: "Request payload failed client-side validation rules."
                    timestamp: "2026-09-08T10:45:05Z"
                    path: "/api/v1/onboarding/documents"
                    correlationId: "corr-789a-4bc1-bf22-1092837465ab"
                    details:
                      - field: "submissionDate"
                        issue: "Submission date cannot be in the future."
                        rejectedValue: "2026-12-31"
                      - field: "file.sizeBytes"
                        issue: "File size exceeds 10 MB limit (10485760 bytes)."
                        rejectedValue: 15728640
        '401':
          description: Unauthorized - Authentication credentials missing, expired, or invalid.
          headers:
            WWW-Authenticate:
              description: Defines the authentication scheme.
              schema:
                type: string
                example: Bearer realm="onboarding-api"
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Missing Bearer Token
                  value:
                    success: false
                    statusCode: 401
                    error: "UNAUTHORIZED"
                    message: "Missing or invalid Bearer Authorization token in header."
                    timestamp: "2026-09-08T10:45:10Z"
                    path: "/api/v1/onboarding/documents"
                    correlationId: "corr-unauth-9912a"
        '409':
          description: Conflict - A submission for this document type and Request ID already exists and is pending or approved.
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateConflict:
                  summary: Duplicate Document Submission Conflict
                  value:
                    success: false
                    statusCode: 409
                    error: "RESOURCE_CONFLICT"
                    message: "A verification document for type 'government-id' with Request ID 'REQ-54321' already exists."
                    timestamp: "2026-09-08T10:45:15Z"
                    path: "/api/v1/onboarding/documents"
                    correlationId: "corr-conflict-8821"
                    existingResourceId: "SUB-731934"
        '500':
          description: Internal Server Error - Unexpected server or database exception while persisting record.
          headers:
            Retry-After:
              description: Suggested wait time in seconds before retrying.
              schema:
                type: integer
                example: 30
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalFault:
                  summary: Server Database Connection Outage
                  value:
                    success: false
                    statusCode: 500
                    error: "INTERNAL_SERVER_ERROR"
                    message: "An unexpected system error occurred while persisting the document record. Please try again."
                    timestamp: "2026-09-08T10:45:20Z"
                    path: "/api/v1/onboarding/documents"
                    correlationId: "corr-err-500-77182"

  /onboarding/documents/{submissionId}:
    get:
      tags:
        - Document Status
      summary: Retrieve status and verification details for a submitted document
      description: |
        Queries the current review status, file verification checksum, HR audit trail, and compliance flags for a specific document submission.
      operationId: getDocumentStatus
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Unique tracking reference code assigned at submission (e.g. SUB-731934).
          schema:
            type: string
            pattern: '^SUB-[0-9]{6,10}$'
            example: SUB-731934
        - name: X-Correlation-ID
          in: header
          required: false
          description: Optional distributed tracing identifier.
          schema:
            type: string
            example: corr-query-98124
      responses:
        '200':
          description: Document record found; status and verification payload returned.
          headers:
            ETag:
              description: Entity tag for optimistic cache validation.
              schema:
                type: string
                example: 'W/"sub-731934-v1"'
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
              examples:
                verifiedStatusResponse:
                  summary: Verified Document Record
                  value:
                    success: true
                    statusCode: 200
                    submissionId: "SUB-731934"
                    requestId: "REQ-54321"
                    employeeName: "Alice Cooper"
                    documentType:
                      code: "government-id"
                      label: "Government Issued Photo ID"
                      mandatory: true
                    submissionDate: "2026-09-08"
                    status: "VERIFIED"
                    file:
                      name: "passport_scan.pdf"
                      sizeBytes: 2097152
                      sizeFormatted: "2 MB"
                      mimeType: "application/pdf"
                      extension: "PDF"
                      checksumSha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                    consentCertified: true
                    auditTrail:
                      submittedAt: "2026-09-08T10:45:00Z"
                      reviewedAt: "2026-09-08T11:15:00Z"
                      reviewedBy: "hr_reviewer_agent_04"
                      verificationNotes: "Clear government photo ID matching legal name."
        '400':
          description: Bad Request - Malformed submissionId parameter format.
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidParam:
                  summary: Invalid Submission ID Format
                  value:
                    success: false
                    statusCode: 400
                    error: "INVALID_PARAMETER"
                    message: "Parameter 'submissionId' must match format 'SUB-XXXXXX'."
                    timestamp: "2026-09-08T10:45:25Z"
                    path: "/api/v1/onboarding/documents/invalid_id"
                    correlationId: "corr-badparam-11"
        '401':
          description: Unauthorized - Authentication token missing or invalid.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer realm="onboarding-api"
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorizedGet:
                  summary: Expired Credentials
                  value:
                    success: false
                    statusCode: 401
                    error: "UNAUTHORIZED"
                    message: "Authorization token expired. Please refresh credentials."
                    timestamp: "2026-09-08T10:45:30Z"
                    path: "/api/v1/onboarding/documents/SUB-731934"
                    correlationId: "corr-auth-expired-22"
        '404':
          description: Not Found - No document submission exists with the specified submissionId.
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Record Not Found
                  value:
                    success: false
                    statusCode: 404
                    error: "DOCUMENT_NOT_FOUND"
                    message: "Document submission with reference 'SUB-999999' was not found."
                    timestamp: "2026-09-08T10:45:35Z"
                    path: "/api/v1/onboarding/documents/SUB-999999"
                    correlationId: "corr-notfound-404"
        '500':
          description: Internal Server Error - Server failure during record lookup.
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverLookupError:
                  summary: Storage Lookup Error
                  value:
                    success: false
                    statusCode: 500
                    error: "INTERNAL_SERVER_ERROR"
                    message: "Failed to query document status due to database timeout."
                    timestamp: "2026-09-08T10:45:40Z"
                    path: "/api/v1/onboarding/documents/SUB-731934"
                    correlationId: "corr-get-500-112"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter standard JWT Bearer token obtained from HR Identity Provider.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Internal microservice API key authentication.

  schemas:
    DocumentTypeEnum:
      type: string
      description: Supported onboarding verification document types.
      enum:
        - government-id
        - tax-form
        - degree-certificate
        - relieving-letter
        - direct-deposit
        - nda-agreement
      example: government-id

    FilePayload:
      type: object
      required:
        - name
        - sizeBytes
        - mimeType
        - extension
      properties:
        name:
          type: string
          description: Original filename of the uploaded verification document.
          maxLength: 255
          example: passport_scan.pdf
        sizeBytes:
          type: integer
          description: File size in bytes (maximum 10 MB = 10,485,760 bytes).
          minimum: 1
          maximum: 10485760
          example: 2097152
        sizeFormatted:
          type: string
          description: Human-readable file size string.
          example: 2 MB
        mimeType:
          type: string
          description: Allowed document MIME types.
          enum:
            - application/pdf
            - image/png
            - image/jpeg
          example: application/pdf
        extension:
          type: string
          description: Upper-case document file extension.
          enum:
            - PDF
            - PNG
            - JPG
            - JPEG
          example: PDF
        contentBase64:
          type: string
          description: Base64 encoded binary payload of the document file.
          example: "JVBERi0xLjQKJcTl8uXr..."

    DocumentSubmissionRequest:
      type: object
      description: Payload for registering an onboarding document submission.
      required:
        - employeeName
        - requestId
        - documentType
        - submissionDate
        - file
        - consentCertified
      properties:
        employeeName:
          type: string
          description: Official full legal name as recorded on government identifications.
          minLength: 2
          maxLength: 60
          pattern: '^[a-zA-Z\s.''-]{2,60}$'
          example: Alice Cooper
        requestId:
          type: string
          description: Unique onboarding applicant request identifier.
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_-]{3,20}$'
          example: REQ-54321
        documentType:
          $ref: '#/components/schemas/DocumentTypeEnum'
        submissionDate:
          type: string
          format: date
          description: Date of document submission (ISO 8601 YYYY-MM-DD). Must be on or before current date.
          example: "2026-09-08"
        file:
          $ref: '#/components/schemas/FilePayload'
        consentCertified:
          type: boolean
          description: Mandatory legal declaration certifying accuracy and authenticity.
          enum: [true]
          example: true

    DocumentSubmissionResponse:
      type: object
      description: Confirmation and registered metadata returned upon successful document submission.
      required:
        - success
        - statusCode
        - submissionId
        - trackingUrl
        - status
        - submittedAt
        - data
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        submissionId:
          type: string
          pattern: '^SUB-[0-9]{6,10}$'
          example: SUB-731934
        trackingUrl:
          type: string
          format: uri
          example: https://api.onboarding.company.com/api/v1/onboarding/documents/SUB-731934
        status:
          type: string
          enum:
            - PENDING_VERIFICATION
            - UNDER_REVIEW
            - VERIFIED
            - REJECTED
          example: PENDING_VERIFICATION
        submittedAt:
          type: string
          format: date-time
          example: "2026-09-08T10:45:00Z"
        data:
          type: object
          properties:
            employeeName:
              type: string
              example: Alice Cooper
            requestId:
              type: string
              example: REQ-54321
            documentType:
              type: object
              properties:
                code:
                  type: string
                  example: government-id
                label:
                  type: string
                  example: Government Issued Photo ID
                mandatory:
                  type: boolean
                  example: true
            submissionDate:
              type: string
              format: date
              example: "2026-09-08"
            file:
              $ref: '#/components/schemas/FilePayload'
            consentCertified:
              type: boolean
              example: true
        timeline:
          type: object
          properties:
            expectedReviewBy:
              type: string
              format: date-time
              example: "2026-09-10T17:00:00Z"
            slaHours:
              type: integer
              example: 48

    DocumentStatusResponse:
      type: object
      description: Full verification status and audit record for a document submission.
      required:
        - success
        - statusCode
        - submissionId
        - requestId
        - employeeName
        - documentType
        - submissionDate
        - status
        - file
        - consentCertified
        - auditTrail
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        submissionId:
          type: string
          example: SUB-731934
        requestId:
          type: string
          example: REQ-54321
        employeeName:
          type: string
          example: Alice Cooper
        documentType:
          type: object
          properties:
            code:
              type: string
              example: government-id
            label:
              type: string
              example: Government Issued Photo ID
            mandatory:
              type: boolean
              example: true
        submissionDate:
          type: string
          format: date
          example: "2026-09-08"
        status:
          type: string
          enum:
            - PENDING_VERIFICATION
            - UNDER_REVIEW
            - VERIFIED
            - REJECTED
          example: VERIFIED
        file:
          type: object
          properties:
            name:
              type: string
              example: passport_scan.pdf
            sizeBytes:
              type: integer
              example: 2097152
            sizeFormatted:
              type: string
              example: 2 MB
            mimeType:
              type: string
              example: application/pdf
            extension:
              type: string
              example: PDF
            checksumSha256:
              type: string
              example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        consentCertified:
          type: boolean
          example: true
        auditTrail:
          type: object
          required:
            - submittedAt
          properties:
            submittedAt:
              type: string
              format: date-time
              example: "2026-09-08T10:45:00Z"
            reviewedAt:
              type: string
              format: date-time
              nullable: true
              example: "2026-09-08T11:15:00Z"
            reviewedBy:
              type: string
              nullable: true
              example: hr_reviewer_agent_04
            verificationNotes:
              type: string
              nullable: true
              example: Clear government photo ID matching legal name.

    ValidationErrorItem:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          description: Name of the JSON path property that failed validation.
          example: submissionDate
        issue:
          type: string
          description: Specific description of rule violation.
          example: Submission date cannot be in the future.
        rejectedValue:
          description: Value that was provided by client and rejected.
          nullable: true
          example: "2026-12-31"

    ErrorResponse:
      type: object
      description: Standardized error envelope returned for all non-2xx status codes.
      required:
        - success
        - statusCode
        - error
        - message
        - timestamp
        - path
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          description: High-level error classification token.
          example: VALIDATION_FAILED
        message:
          type: string
          description: Actionable, human-readable error explanation.
          example: Request payload failed client-side validation rules.
        timestamp:
          type: string
          format: date-time
          example: "2026-09-08T10:45:05Z"
        path:
          type: string
          example: /api/v1/onboarding/documents
        correlationId:
          type: string
          example: corr-789a-4bc1-bf22-1092837465ab
        details:
          type: array
          description: Optional list of field-level validation breakdowns (typically present on 400).
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
        existingResourceId:
          type: string
          description: Referenced conflicting ID (present on 409).
          nullable: true
          example: SUB-731934
